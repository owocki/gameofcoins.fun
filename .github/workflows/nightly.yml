name: Nightly atlas survey

on:
  schedule:
    # 06:10 UTC = 00:10 America/Denver during daylight time (01:10 in winter)
    - cron: "10 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nightly-survey
  cancel-in-progress: false

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK
        run: pip install anthropic

      - name: Research today's discourse
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/research.py

      - name: Commit the day's data
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "survey: $(date -u +%F)"
            git push
          fi
